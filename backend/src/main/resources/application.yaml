spring:
  application:
    name: bookly-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookly}
    username: ${SPRING_DATASOURCE_USERNAME:bookly}
    password: ${SPRING_DATASOURCE_PASSWORD:bookly}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
