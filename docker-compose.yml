services:
  postgres:
    image: postgres:16-alpine
    container_name: bookly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookly}
      POSTGRES_USER: ${POSTGRES_USER:-bookly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookly}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookly} -d ${POSTGRES_DB:-bookly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bookly-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookly}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookly}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookly}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: bookly-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "5173:5173"

volumes:
  postgres-data:
